name: Nightly Full Suite + Allure Publish
on:
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:

concurrency:
  # Cron + manual dispatch — NÃO cancelamos runs em andamento. Se cron das 3h
  # estiver gerando Allure e dispatch manual disparar simultâneo, deixar ambos
  # rodarem (matrix multi-browser) garante que histórico de Allure não é perdido.
  group: nightly-${{ github.workflow }}-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.nvmrc', cache: 'npm' }
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.project == 'mobile-chrome' && 'chromium' || matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}
        env: { CI: 'true' }
        continue-on-error: true
      # Bug-regression suite: 22 specs 1:1 com bugs Open. Falhas esperadas
      # enquanto não corrigidos — gate detecta REGRESSÃO de bug Closed.
      - name: Bug regression (informativo)
        run: npm run test:bugs
        env: { CI: 'true' }
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bug-evidence-${{ matrix.project }}
          path: bug-reports/evidence/*/auto-runs/
          if-no-files-found: ignore
  publish:
    needs: full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: gh-pages, path: gh-pages }
        continue-on-error: true
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { path: ./all-results }
      - name: Merge Allure results
        run: |
          mkdir -p allure-results
          find ./all-results -type d -name 'allure-results-*' -exec cp -r {}/. allure-results/ \;
      - name: Restore Allure history
        run: |
          if [ -d gh-pages/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/history/* allure-results/history/ || true
          fi
      - name: Install Allure CLI
        run: npm install -g allure-commandline@2.29.0
      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
          keep_files: false
